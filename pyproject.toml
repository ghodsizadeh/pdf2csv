[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
pdf2csv = [".agents/skills/*/SKILL.md"]

[project]
name = "pdf2csv"
version = "0.3.0"
description = "A python library and CLI tool to convert PDF tables to CSV or Excel files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.7",
    "typer>=0.12.5",
]
license = { text = "MIT License" }
keywords = [
    "pdf",
    "csv",
    "excel",
    "pdf2csv",
    "data extraction",
    "tables",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" },
]

[project.urls]
Homepage = "https://github.com/ghodsizadeh/pdf2csv"
Issues = "https://github.com/ghodsizadeh/pdf2csv/issues"
Repository = "https://github.com/ghodsizadeh/pdf2csv.git"

[project.scripts]
pdf2csv = "pdf2csv.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.6",
]

examples = [
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "reportlab>=4.4.0",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Explicit selection so a newer Ruff cannot change the result by expanding
# its defaults. This is the rule set Ruff 0.8 used, which CI locks.
select = ["E4", "E7", "E9", "F"]
