name: Test Coverage

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Run tests with coverage
        run: uv run --no-sync --python '${{ matrix.python-version }}' pytest --cov=pdf2csv --cov-report=xml
      - name: Verify example PDFs are reproducible
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --group examples python examples/generate.py
          git diff --exit-code -- examples/
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
